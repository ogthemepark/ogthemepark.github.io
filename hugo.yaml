baseURL: "https://ogthemepark.github.io/"
languageCode: "en-us"
title: "ogthemepark"
theme: "blowfish"

enableRobotsTXT: true
paginate: 10

params:
  colorScheme: "ocean"
  defaultAppearance: "dark"
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true

  author:
    name: "ogthemepark"
    headline: "Learning in public"
    bio: "Hope is a good thing, maybe the best of things."
    links:
      - github: "https://github.com/ogthemepark"

  homepage:
    layout: "profile"
    showRecent: true
    showRecentItems: 5
    showMoreLink: true
    showMoreLinkDest: "/posts/"

  article:
    showDate: true
    showReadingTime: true
    showTableOfContents: true
    showTags: true

  list:
    showCards: true

  header:
    layout: "basic"

menus:
  main:
    - name: Posts
      pageRef: /posts
      weight: 10
    - name: Tags
      pageRef: /tags
      weight: 20
